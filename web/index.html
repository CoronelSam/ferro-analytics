<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
   <link rel="icon" type="image/svg+xml" href="public/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const tema = localStorage.getItem('ferroanalytics-tema');
          document.documentElement.dataset.theme = tema === 'dark' ? 'dark' : 'light';
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <title>FerroAnalytics</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
